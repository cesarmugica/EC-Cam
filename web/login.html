<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EC-Cam · Entrar</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/pwa-192.png">
<meta name="theme-color" content="#121614">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EC-Cam">
<script src="/pwa.js?v=1" defer></script>
<style>
  :root { color-scheme: dark; --bg: #121614; --card: #1b201d; --line: #2c3430; --text: #f3f5f4; --muted: #9aa6a0; --accent: #F07C1E; --bad: #ff8a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(1200px 600px at 50% -10%, #1f2622, var(--bg)); color: var(--text);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .card { width: min(400px, 100%); padding: 32px 28px 26px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .logo { display: block; width: 84px; height: 84px; margin: 0 auto 14px; }
  h1 { margin: 0; text-align: center; font-size: 1.6rem; letter-spacing: -.01em; }
  .sub { margin: 6px 0 22px; text-align: center; color: var(--muted); font-size: .92rem; line-height: 1.5; }
  label { display: block; margin: 14px 0 6px; font-size: .85rem; font-weight: 650; }
  input { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(.93); } button:disabled { opacity: .6; cursor: wait; }
  button.secondary { margin-top: 12px; background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
  .msg { min-height: 1.3em; margin-top: 14px; font-size: .88rem; text-align: center; color: var(--bad); }
  .note { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: .85rem; line-height: 1.5; }
  .note code { color: var(--text); }
  .hidden { display: none !important; }
  footer { margin-top: 18px; text-align: center; color: var(--muted); font-size: .75rem; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/img/pwa-192.png" alt="">
  <h1>EC-Cam</h1>
  <p id="sub" class="sub">Tus cámaras Tapo, desde cualquier lugar.</p>

  <form id="loginForm" class="hidden" autocomplete="on">
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Entrar</button>
  </form>

  <div id="setupLocked" class="note hidden">
    EC-Cam todavía no tiene usuarios. Abre <code>http://127.0.0.1:8790/setup</code> en la PC donde está instalado
    el servidor para crear el administrador.
  </div>

  <div id="msg" class="msg" role="alert" aria-live="polite"></div>
  <button type="button" class="secondary" data-instalar data-instalar-ios="En Safari toca Compartir y luego «Agregar a pantalla de inicio»." style="display:none">Instalar app</button>
  <footer>EC-Cam · basado en Topo (MIT)</footer>
</main>
<script>
(function () {
  var form = document.getElementById('loginForm'), msg = document.getElementById('msg'), sub = document.getElementById('sub'),
      submit = document.getElementById('submit'), locked = document.getElementById('setupLocked'), mode = 'login';
  function post(path, body) {
    return fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || ('Error ' + r.status)); return d; }); });
  }
  function setMode(next) {
    mode = next;
    form.classList.toggle('hidden', next === 'locked');
    locked.classList.toggle('hidden', next !== 'locked');
    if (next === 'setup') {
      sub.textContent = 'Primera vez: crea el usuario administrador de EC-Cam.';
      submit.textContent = 'Crear administrador';
      document.getElementById('password').setAttribute('autocomplete', 'new-password');
      document.title = 'EC-Cam · Configuración inicial';
    }
    if (next === 'login') document.getElementById('username').focus();
  }
  fetch('/api/app/session', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (s) {
    if (s.app_authenticated) { location.replace('/'); return; }
    if (s.needs_setup) setMode(s.setup_allowed ? 'setup' : 'locked'); else setMode('login');
  }).catch(function () { setMode('login'); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submit.disabled = true; msg.textContent = '';
    var body = { username: document.getElementById('username').value, password: document.getElementById('password').value };
    post(mode === 'setup' ? '/api/app/setup' : '/api/app/login', body)
      .then(function () { location.replace('/'); })
      .catch(function (err) { msg.textContent = err.message; document.getElementById('password').value = ''; })
      .finally(function () { submit.disabled = false; });
  });
})();
</script>
</body>
</html>
