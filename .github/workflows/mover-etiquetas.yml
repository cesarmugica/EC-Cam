# Uso único: mueve las etiquetas de versión (v1.0.0 … v2.1.0) a los commits
# reescritos sin el enlace del chat. Se arranca a mano y después se borra.
name: Mover etiquetas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mover cada etiqueta a su commit limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha no está en main"; exit 1; }
            git tag -f "$tag" "$sha"
            git push -f origin "refs/tags/$tag"
            echo "$tag -> $sha"
          done <<'MAPA'
            v1.0.0 1cea7902ae20c371d44de5e94a324ddfeb99df20
            v1.0.1 d301565bafec024c0c51ae048787381b7147eab4
