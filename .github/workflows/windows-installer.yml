# Compila el instalador de Windows de EC-Cam en GitHub (no se instala nada en tu PC).
# - Cada push a main compila EC-Cam-Setup (pestaña Actions).
# - Si APP_VERSION (eccam_server.py) es nueva, publica un Release con el .exe.
name: Instalador Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyInstaller e Inno Setup
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Compilar instalador
        shell: pwsh
        run: ./windows/build.ps1

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: EC-Cam-Setup
          path: windows/out/*.exe
          if-no-files-found: error

      - name: Publicar Release (si la versión es nueva)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem windows/out/*.exe | Select-Object -First 1
          $version = (Select-String -Path eccam_server.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "La versión $tag ya está publicada; súbele APP_VERSION para publicar otra."; exit 0 }
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash + "  " + $exe.Name | Out-File windows/out/SHA256SUMS.txt -Encoding ascii
          gh release create $tag $exe.FullName windows/out/SHA256SUMS.txt --target $env:GITHUB_SHA --title "EC-Cam $tag" --notes "Instalador de Windows de EC-Cam. Descarga EC-Cam-Setup-$version.exe y ejecútalo en la PC servidor."
          exit 0
